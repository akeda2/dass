[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dass"
version = "0.1.0"
description = "Document assembler for numbered text-file structures"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "dass contributors" }
]
dependencies = [
  "Markdown>=3.5",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0"
]

[project.scripts]
dass = "dass:main"

[tool.setuptools]
py-modules = ["dass"]

[tool.setuptools.data-files]
"share/bash-completion/completions" = ["completions/dass"]
